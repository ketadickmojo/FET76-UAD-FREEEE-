name: Build VST3 + AU on macOS

on:
  push:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake for Apple Silicon
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: |
          cmake --build build \
            --config Release \
            --parallel

      - name: Verify VST3 architecture
        run: |
          file build/FET76_artefacts/Release/VST3/FET76.vst3/Contents/MacOS/FET76

      - name: Verify AU architecture
        run: |
          file build/FET76_artefacts/Release/AU/FET76.component/Contents/MacOS/FET76

      - name: Package plugins
        run: |
          mkdir -p out
          cp -R build/FET76_artefacts/Release/VST3/FET76.vst3 out/
          cp -R build/FET76_artefacts/Release/AU/FET76.component out/

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: FET76-macOS-Apple-Silicon
          path: out/

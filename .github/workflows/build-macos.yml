name: Build VST3 on macOS

on:
  push:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake for Apple Silicon
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: |
          cmake --build build \
            --config Release \
            --parallel

      - name: Verify plugin architecture
        run: |
          file build/FET76_artefacts/Release/VST3/FET76.vst3/Contents/MacOS/FET76

      - name: Package VST3
        run: |
          mkdir -p out
          cp -R build/FET76_artefacts/Release/VST3/FET76.vst3 out/

      - name: Upload built plugin
        uses: actions/upload-artifact@v4
        with:
          name: FET76-vst3-macos-arm64
          path: out/FET76.vst3 

